<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astronaut Health Monitor</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050a14;--panel:#0a1424cc;--line:#1b3050;--tx:#d6e6ff;--dim:#7f96b8;--ok:#33f0a0;--warn:#ffc233;--bad:#ff3b4e;--art:#ff4256;--vein:#3b8cff;--cy:#38d9ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:0;width:100%;height:100%}
body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000030 3px 4px);animation:scan 8s linear infinite}
@keyframes scan{to{background-position:0 80px}}
#alertfx{position:fixed;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 0 transparent;transition:box-shadow .4s}
body.crit #alertfx{animation:flash .9s infinite}
@keyframes flash{50%{box-shadow:inset 0 0 120px #ff3b4e99}}
main{position:relative;z-index:2;max-width:1400px;margin:auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{margin:0;font:700 22px/1.1 "Palatino Linotype",Georgia,serif;letter-spacing:.5px}
h1 small{display:block;font:12px "Trebuchet MS",sans-serif;color:var(--dim);letter-spacing:0}
.badge{padding:6px 16px;border-radius:30px;font-weight:700;border:1px solid;transition:.3s}
.s0{color:var(--ok);border-color:var(--ok);background:#33f0a014}.s1{color:var(--warn);border-color:var(--warn);background:#ffc23318}.s2{color:var(--bad);border-color:var(--bad);background:#ff3b4e22}
.clock{font:600 18px "Courier New",monospace;color:var(--cy);text-shadow:0 0 10px var(--cy)}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr) minmax(0,1fr);gap:12px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;backdrop-filter:blur(6px)}
.panel h2{margin:0 0 8px;font-size:14px;color:var(--cy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:8px;background:#0b1830;transition:.3s}
.card.s1{border-left-color:var(--warn)}.card.s2{border-left-color:var(--bad);animation:pulse .8s infinite}
@keyframes pulse{50%{box-shadow:0 0 18px #ff3b4e88}}
.card b{display:block;font-size:12px;color:var(--dim);font-weight:400}
.card .v{font:700 24px "Courier New",monospace}.card u{text-decoration:none;font-size:11px;color:var(--dim)}
.card .st{font-size:11px;font-weight:700}
canvas.view{width:100%;display:block;border-radius:8px;background:radial-gradient(#0e2240,#050a14)}
#log{height:170px;overflow:auto;font:12px "Courier New",monospace}
#log div{padding:2px 0;border-bottom:1px dashed #1b305055}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button,select{background:#10233f;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--cy)}button:focus-visible,select:focus-visible{outline:2px solid var(--cy)}
button.on{background:#0d4a5e;border-color:var(--cy)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
#tabbody{min-height:200px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}th{color:var(--cy)}
.tl{display:grid;gap:6px}
.ev{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:6px 8px;border-radius:6px;border-left:4px solid var(--line);background:#0b1830}
.ev.eat{border-color:var(--ok)}.ev.ex{border-color:var(--vein)}.ev.sl{border-color:#9b7bff}.ev.no{border-color:var(--bad)}.ev.now{outline:2px solid var(--cy);box-shadow:0 0 14px #38d9ff66}
.ev time{font:600 13px "Courier New",monospace}
.banner{padding:10px;border-radius:8px;margin-bottom:8px;font-weight:700}
ul{margin:4px 0;padding-left:18px}
@media(prefers-reduced-motion:reduce){body::after,.card.s2,body.crit #alertfx{animation:none}}
</style></head><body>
<canvas id="stars"></canvas><div id="alertfx"></div>
<main>
<header>
<h1>Astronaut Health Monitor<small>Crew member A-01 · Orbital station · Live telemetry (simulated)</small></h1>
<div class="clock" id="met">MET 000d 00:00:00</div>
<div class="badge s0" id="overall">ALL SYSTEMS NOMINAL</div>
</header>
<div class="grid">
<section class="panel"><h2>Vital signs</h2><div class="cards" id="cards"></div>
<div class="ctl" id="faults"></div></section>
<section class="panel"><h2>Cardiovascular scan</h2><canvas class="view" id="body" width="400" height="560"></canvas></section>
<section>
<div class="panel"><h2>ECG · lead II</h2><canvas class="view" id="ecg" width="500" height="150"></canvas></div>
<div class="panel" style="margin-top:12px"><h2>Event log</h2><div id="log"></div>
<div class="ctl"><button id="chaos">Auto-faults: OFF</button><button id="clear">Clear faults</button><select id="speed" aria-label="Time speed"><option value="60">Clock ×60</option><option value="240" selected>Clock ×240</option><option value="900">Clock ×900</option></select></div></div>
</section></div>
<div class="tabs" id="tabs"></div>
<div class="panel" id="tabbody"></div>
</main>
<script>
// ---------- vitals model ----------
const V=[
{id:'hr',n:'Heart rate',u:'bpm',b:72,r:5,d:0,w:[50,100],c:[40,130]},
{id:'spo2',n:'Blood oxygen',u:'%',b:98,r:.5,d:1,w:[94,101],c:[90,101],max:100},
{id:'sys',n:'BP systolic',u:'mmHg',b:118,r:4,d:0,w:[90,135],c:[80,160]},
{id:'dia',n:'BP diastolic',u:'mmHg',b:76,r:3,d:0,w:[55,88],c:[45,100]},
{id:'temp',n:'Body temp',u:'°C',b:36.8,r:.1,d:1,w:[36,37.8],c:[35,39]},
{id:'rr',n:'Breathing',u:'/min',b:15,r:1,d:0,w:[10,20],c:[8,28]},
{id:'hyd',n:'Hydration',u:'%',b:82,r:1.5,d:0,w:[65,101],c:[50,101],max:100},
{id:'co2',n:'Cabin CO₂',u:'mmHg',b:2.8,r:.15,d:1,w:[0,4.5],c:[0,6]},
{id:'rad',n:'Radiation',u:'µSv/h',b:22,r:3,d:0,w:[0,40],c:[0,80]},
{id:'bone',n:'Bone density',u:'% base',b:96.5,r:.15,d:1,w:[94,200],c:[90,200]}
];
V.forEach(x=>{x.v=x.b;x.off=0;x.st=0});
const FAULTS={cardiac:{l:'Cardiac event',o:{hr:75,sys:42,spo2:-4}},hypoxia:{l:'Hypoxia',o:{spo2:-10,rr:13,hr:25}},fever:{l:'Fever',o:{temp:2.4,hr:28,hyd:-20}},dehyd:{l:'Dehydration',o:{hyd:-38,sys:-28,hr:20}},rad:{l:'Solar flare',o:{rad:75}},co2:{l:'CO₂ scrubber fail',o:{co2:3.6,rr:9,hr:15}}};
let faultT=0,active=null;
const $=id=>document.getElementById(id);
$('cards').innerHTML=V.map(x=>`<div class="card" id="c_${x.id}"><b>${x.n}</b><span class="v" id="v_${x.id}">--</span> <u>${x.u}</u><div class="st" id="s_${x.id}"></div></div>`).join('');
$('faults').innerHTML='<span style="color:var(--dim);font-size:12px;width:100%">Inject a test fault:</span>'+Object.keys(FAULTS).map(k=>`<button data-f="${k}">${FAULTS[k].l}</button>`).join('');
$('faults').onclick=e=>{const k=e.target.dataset.f;if(k)inject(k)};
function inject(k){clear();active=k;faultT=60;for(const id in FAULTS[k].o)V.find(x=>x.id==id).off=FAULTS[k].o[id];log(`TEST FAULT injected: ${FAULTS[k].l}`,1)}
function clear(){V.forEach(x=>x.off=0);active=null;faultT=0}
$('clear').onclick=()=>{clear();log('Faults cleared, vitals recovering',0)};
let chaos=false;$('chaos').onclick=()=>{chaos=!chaos;$('chaos').textContent='Auto-faults: '+(chaos?'ON':'OFF');$('chaos').className=chaos?'on':''};
const NAMES=['NOMINAL','WARNING','CRITICAL'],CLS=['s0','s1','s2'];
let mt=0;
function met(){const s=Math.floor(simSec),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sc=s%60,p=n=>String(n).padStart(2,'0');return `${p(d)}d ${p(h)}:${p(m)}:${p(sc)}`}
function log(t,l){const e=document.createElement('div');e.style.color=['var(--ok)','var(--warn)','var(--bad)'][l];e.textContent=`[${met()}] ${t}`;$('log').prepend(e)}
function tick(){
 let worst=0;
 if(chaos&&!active&&Math.random()<.04)inject(Object.keys(FAULTS)[Math.floor(Math.random()*6)]);
 if(active&&--faultT<=0){clear();log('Fault ended, crew recovering',0)}
 V.forEach(x=>{
  x.v+=(x.b+x.off-x.v)*.12+(Math.random()-.5)*x.r;
  if(x.max)x.v=Math.min(x.v,x.max);
  const s=(x.v<x.c[0]||x.v>x.c[1])?2:(x.v<x.w[0]||x.v>x.w[1])?1:0;
  if(s!==x.st){log(`${x.n} ${NAMES[s]} (${x.v.toFixed(x.d)} ${x.u})`,s);x.st=s}
  worst=Math.max(worst,s);
  $('v_'+x.id).textContent=x.v.toFixed(x.d);
  $('c_'+x.id).className='card '+CLS[s];$('s_'+x.id).textContent=NAMES[s];$('s_'+x.id).style.color=['var(--ok)','var(--warn)','var(--bad)'][s];
 });
 const o=$('overall');o.className='badge '+CLS[worst];o.textContent=['ALL SYSTEMS NOMINAL','CAUTION: CHECK CREW','CRITICAL: MEDICAL ALERT'][worst];
 document.body.classList.toggle('crit',worst==2);
}
setInterval(tick,500);tick();
// ---------- clock ----------
let simSec=6*3600,last=performance.now();
function clockLoop(now){const sp=+$('speed').value;simSec+=(now-last)/1000*sp;last=now;$('met').textContent='MET '+met();renderLive();requestAnimationFrame(clockLoop)}
// ---------- stars ----------
const sc=$('stars'),sx=sc.getContext('2d');let S=[];
function rs(){sc.width=innerWidth;sc.height=innerHeight;S=Array.from({length:160},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,z:Math.random()*2+.3}))}
rs();addEventListener('resize',rs);
function stars(){sx.clearRect(0,0,sc.width,sc.height);S.forEach(s=>{s.x-=s.z*.25;if(s.x<0)s.x=sc.width;sx.fillStyle=`rgba(180,215,255,${.25+s.z*.3})`;sx.fillRect(s.x,s.y,s.z,s.z)})}
// ---------- heart, veins, particles ----------
const bc=$('body'),b=bc.getContext('2d');
const PATHS=[[[205,175],[205,130],[200,95],[200,62]],[[215,180],[250,172],[285,222],[300,290],[312,352]],[[185,180],[150,172],[115,222],[100,290],[88,352]],[[205,210],[208,280],[212,340],[228,420],[232,500]],[[195,300],[188,340],[176,420],[168,500]]];
const sh=(p,dx)=>p.map(q=>[q[0]+dx,q[1]]);
const ART=PATHS,VEN=PATHS.map(p=>sh(p,9).reverse());
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L}
function at(p,t){let L=plen(p)*t,i=1;for(;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(L<=d)return[p[i-1][0]+(p[i][0]-p[i-1][0])*L/d,p[i-1][1]+(p[i][1]-p[i-1][1])*L/d];L-=d}return p[p.length-1]}
const P=[];for(let k=0;k<5;k++)for(let j=0;j<14;j++){P.push({p:ART[k],t:j/14,a:1});P.push({p:VEN[k],t:j/14,a:0})}
function line(p,col,w,blur){b.beginPath();p.forEach((q,i)=>i?b.lineTo(q[0],q[1]):b.moveTo(q[0],q[1]));b.strokeStyle=col;b.lineWidth=w;b.shadowColor=col;b.shadowBlur=blur;b.lineJoin=b.lineCap='round';b.stroke();b.shadowBlur=0}
function heart(cx,cy,s,col){b.save();b.translate(cx,cy);b.scale(s,s);b.beginPath();b.moveTo(0,22);b.bezierCurveTo(-45,-5,-30,-42,0,-18);b.bezierCurveTo(30,-42,45,-5,0,22);b.fillStyle=col;b.shadowColor=col;b.shadowBlur=30*s;b.fill();b.restore();b.shadowBlur=0}
let phase=0,lastT=performance.now(),scanY=0,E=new Array(250).fill(0),ec=$('ecg').getContext('2d');
const g=(x,m,s,a)=>a*Math.exp(-(((x-m)/s)**2)/2);
const wave=p=>g(p,.12,.03,.18)+g(p,.27,.012,-.15)+g(p,.3,.012,1)+g(p,.33,.014,-.25)+g(p,.55,.05,.3);
function frame(now){
 const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
 const hr=V[0].v,st=V[0].st,spo=V[1].v;
 phase+=dt*hr/60;if(phase>=1)phase-=1;
 const sc2=1+.17*Math.exp(-phase*9),col=st==2?'#ff1f3a':'#ff3b5e';
 stars();
 b.clearRect(0,0,400,560);
 const bob=Math.sin(now/1300)*5;b.save();b.translate(Math.sin(now/2100)*4,bob);
 // zero-g floating body glow
 b.fillStyle='#38d9ff10';b.beginPath();b.arc(200,52,32,0,7);b.fill();
 b.strokeStyle='#38d9ff55';b.lineWidth=1.5;b.stroke();
 ART.forEach(p=>{line(p,'#38d9ff12',34,0)});
 ART.forEach(p=>line(p,'#ff425655',3,8));VEN.forEach(p=>line(p,'#3b8cff66',3,8));
 const spd=hr/72*.22*(1+.8*Math.exp(-phase*6));
 P.forEach(q=>{q.t+=dt*spd;if(q.t>1)q.t-=1;const [x,y]=at(q.p,q.t);const c=q.a?(spo<94?'#d65a8a':'#ff6a7a'):'#4aa0ff';b.fillStyle=c;b.shadowColor=c;b.shadowBlur=10;b.beginPath();b.arc(x,y,q.a?2.6:2.2,0,7);b.fill()});b.shadowBlur=0;
 // halo pulse
 b.beginPath();b.arc(200,192,38+60*phase,0,7);b.strokeStyle=`rgba(255,66,86,${.5*(1-phase)})`;b.lineWidth=2;b.stroke();
 heart(200,192,1.15*sc2,col);
 b.fillStyle='#ffd0d6';b.font='bold 13px Courier New';b.textAlign='center';b.fillText(Math.round(hr)+' BPM',200,198);
 b.restore();
 // scan line
 scanY=(scanY+90*dt)%560;const gr=b.createLinearGradient(0,scanY-40,0,scanY);gr.addColorStop(0,'#38d9ff00');gr.addColorStop(1,'#38d9ff55');b.fillStyle=gr;b.fillRect(0,scanY-40,400,40);
 b.fillStyle='#7f96b8';b.font='11px Courier New';b.textAlign='left';b.fillText('● ARTERIES  ● VEINS',10,548);
 // ECG
 for(let i=0;i<2;i++)E.push(wave(phase)+(Math.random()-.5)*.04+(st==2?(Math.random()-.5)*.25:0)),E.shift();
 ec.clearRect(0,0,500,150);ec.strokeStyle='#1b305088';ec.lineWidth=1;for(let x=0;x<500;x+=25){ec.beginPath();ec.moveTo(x,0);ec.lineTo(x,150);ec.stroke()}
 ec.beginPath();E.forEach((v,i)=>ec.lineTo(i*2,115-v*85));ec.strokeStyle=st==2?'#ff3b4e':'#33f0a0';ec.shadowColor=ec.strokeStyle;ec.shadowBlur=10;ec.lineWidth=2;ec.stroke();ec.shadowBlur=0;
 requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
// ---------- info panels ----------
const hm=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const SCH=[
[360,'sl','Wake-up','Weigh-in, medical check, drink 500 ml water. Do not skip.'],
[390,'eat','Breakfast','Eat. ~700–800 kcal, protein + carbs. Strong flavours taste better because fluid shift dulls taste and smell.'],
[510,'ex','Exercise 1','Treadmill with harness or resistive device (ARED), ~60–75 min. Last meal at least 90 min before.'],
[660,'eat','Rehydrate + snack','Water or electrolyte drink and a light snack after exercise.'],
[750,'eat','Lunch','Eat. ~800–900 kcal, with calcium and vitamin D foods.'],
[840,'no','Work block: caffeine cut-off at 15:00','Avoid new caffeine after this block to protect sleep.'],
[960,'ex','Exercise 2','Cycle ergometer (cardio), ~45–60 min.'],
[1050,'eat','Light snack','Fruit or nuts. Keep it small.'],
[1110,'eat','Dinner','Eat. ~800–900 kcal. Finish by 19:30.'],
[1200,'no','No heavy food from now','Heavy meals within 2 h of sleep cause reflux, because there is no gravity to keep food down.'],
[1290,'sl','Wind-down','Dim lights, sip water only, log symptoms.'],
[1320,'sl','Sleep (8 h)','Strap into the sleeping bag. Do not eat in the sleep period.']];
const TABS={
food:()=>`<div class="banner" id="mealst"></div><div class="tl">${SCH.map((e,i)=>`<div class="ev ${e[1]}" data-i="${i}"><time>${hm(e[0])}</time><div><b>${e[2]}</b><br><span style="color:var(--dim)">${e[3]}</span></div></div>`).join('')}</div>
<h2 style="margin-top:14px">Food rules in zero gravity</h2><ul><li>Roughly 2,500–3,000 kcal a day, in three main meals about 6 h apart, plus light snacks.</li><li>Drink about 2–3 L of fluid a day. Thirst signals weaken in space.</li><li><b>Do not eat:</b> crumbly food (bread, chips) because crumbs float into eyes and equipment; fizzy drinks (gas does not separate from liquid, so it bloats you); heavy meals right before exercise or sleep.</li><li>Keep sodium moderate. High salt speeds up calcium and bone loss.</li><li>Eat calcium, vitamin D, protein, omega-3 and antioxidant foods. Vitamin D is usually supplemented because there is no sunlight on the skin.</li><li>Eat slowly. Food is held in sticky or packaged form so it does not float away.</li></ul>`,
zero:()=>`<table><tr><th>What happens</th><th>Details</th></tr>
<tr><td>Fluid shift</td><td>About 1.5–2 L of body fluid moves from the legs to the chest and head within hours. Result: puffy face, thin legs ("chicken legs"), stuffy nose, headache.</td></tr>
<tr><td>Space adaptation sickness</td><td>Affects around half of astronauts for the first 2–3 days. The inner ear (vestibular system) loses its gravity reference. Nausea, vomiting, dizziness.</td></tr>
<tr><td>Bone loss</td><td>About 1–1.5% bone density lost per month in weight-bearing bones (hips, spine, legs). Calcium in blood and urine rises, kidney-stone risk goes up.</td></tr>
<tr><td>Muscle loss</td><td>Postural (anti-gravity) muscles weaken fast. Without exercise, large losses happen in days to weeks. Exercise ~2 h a day slows this.</td></tr>
<tr><td>Heart</td><td>Less work against gravity, so the heart gets smaller and more spherical over long missions. Blood volume falls about 10%. On return, standing up can cause fainting (orthostatic intolerance).</td></tr>
<tr><td>Eyes</td><td>Head-ward fluid and raised pressure can flatten the back of the eye and swell the optic disc. Called SANS. It can blur vision on long missions.</td></tr>
<tr><td>Spine and height</td><td>The spine decompresses and astronauts grow about 2–5 cm taller. Back pain is common in the first weeks.</td></tr>
<tr><td>Blood</td><td>Red blood cell production drops ("space anemia") because of the fluid shift.</td></tr>
<tr><td>Immune system</td><td>Stress, radiation and disrupted sleep weaken some immune responses. Dormant viruses can reactivate.</td></tr>
<tr><td>Sleep</td><td>The station sees about 16 sunrises a day. Light schedules, noise and a fixed work routine are used to protect sleep.</td></tr>
<tr><td>Radiation</td><td>About 0.5 mSv per day on a low-orbit station, roughly 50–100 times ground level. This raises long-term cancer and cataract risk.</td></tr>
<tr><td>Mind</td><td>Isolation, confinement and the distance from home affect mood. Regular contact with family and a clear schedule help.</td></tr></table>`,
anat:()=>`<table><tr><th>System</th><th>On Earth</th><th>In zero gravity</th></tr>
<tr><td>Heart and vessels</td><td>Pumps blood up against gravity. Valves keep leg blood from pooling.</td><td>Blood spreads evenly. Heart works less, shrinks, and neck veins can swell.</td></tr>
<tr><td>Bones</td><td>Constant load makes bone rebuild itself.</td><td>No load. Bone breaks down faster than it builds.</td></tr>
<tr><td>Muscles</td><td>Legs and back hold you upright.</td><td>Not needed for posture, so they waste. Fast-twitch fibres are hit hardest.</td></tr>
<tr><td>Lungs</td><td>Lower lungs get more blood and air.</td><td>Blood and air spread evenly, which makes gas exchange more uniform. Breathing is easier at rest.</td></tr>
<tr><td>Brain and inner ear</td><td>Otolith organs sense "down".</td><td>Signals disagree with vision. The brain re-learns within days.</td></tr>
<tr><td>Gut</td><td>Food moves with help from gravity.</td><td>Muscle waves still move food (peristalsis), but reflux and bloating are more common.</td></tr>
<tr><td>Kidneys</td><td>Filter normal calcium load.</td><td>More calcium to filter, so stones are more likely. Hydration is key.</td></tr>
<tr><td>Skin</td><td>Sheds and heals normally.</td><td>Thinner, more sensitive, slower healing. Calluses form on the tops of feet from restraint loops.</td></tr></table>`,
meas:()=>`<ul><li><b>Exercise:</b> about 2 h a day, 6 days a week. Treadmill (T2), ARED resistance device and cycle ergometer.</li><li><b>Lower-body negative pressure and compression garments</b> pull fluid back toward the legs.</li><li><b>Nutrition:</b> calcium, vitamin D, protein and enough calories. Under-eating speeds muscle and bone loss.</li><li><b>Medicine:</b> bisphosphonates in some studies for bone, anti-nausea drugs for the first days.</li><li><b>Monitoring:</b> daily vitals, regular ultrasound of heart and eyes, blood and urine tests, dosimeters for radiation.</li><li><b>Shielding:</b> shelter in the most shielded module during solar flares.</li><li><b>Re-entry:</b> fluid-loading and compression suits to prevent fainting.</li></ul><p style="color:var(--dim)">Educational simulation. Values shown are simulated and are not medical advice.</p>`};
const TN={food:'Food and timing',zero:'Body in zero-G',anat:'Anatomy map',meas:'Countermeasures'};
let cur='food';
$('tabs').innerHTML=Object.keys(TN).map(k=>`<button data-t="${k}">${TN[k]}</button>`).join('');
function show(k){cur=k;$('tabbody').innerHTML=TABS[k]();[...$('tabs').children].forEach(b=>b.className=b.dataset.t==k?'on':'')}

 const msg={eat:['s0','EAT NOW: '+SCH[idx][2]],ex:['s1','EXERCISE TIME: no food now'],no:['s2','DO NOT EAT HEAVY FOOD NOW'],sl:['s1','REST PERIOD: no food']}[k];
 bn.className='banner '+msg[0];bn.textContent=`Crew time ${hm(m)} · ${msg[1]}`}

</script></body></html>
